<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE ORDER OF THE DOUBLE HELIX</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12;
    --panel: #12121e;
    --border: #3a3a6a;
    --accent: #e8c84a;
    --accent2: #4ae8b0;
    --accent3: #e84a7a;
    --text: #d0d0e8;
    --dim: #6a6a9a;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --shadow: #000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
  body {
    background: var(--bg);
    font-family: 'Press Start 2P', monospace;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events: none;
    z-index: 999;
  }

  #game {
    width: 760px;
    max-width: 100vw;
    position: relative;
  }

  /* Stars background */
  .stars {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: -1;
    overflow: hidden;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    opacity: 0.4;
    animation: twinkle 3s infinite;
  }

  @keyframes twinkle {
    0%,100% { opacity: 0.2; }
    50% { opacity: 0.7; }
  }

  /* Title screen */
  #title-screen {
    text-align: center;
    padding: 40px 20px;
    animation: fadeIn 1s ease;
  }
  .title-logo {
    font-size: 16px;
    line-height: 2.2;
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent), 0 0 40px rgba(232,200,74,0.3);
    margin-bottom: 24px;
    letter-spacing: 2px;
  }
  .title-sub {
    font-size: 11px;
    color: var(--accent2);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .title-desc {
    font-size: 10px;
    color: var(--dim);
    margin-bottom: 40px;
    line-height: 2.4;
  }

  .pixel-btn {
    background: var(--panel);
    border: 3px solid var(--accent);
    color: var(--accent);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    padding: 14px 28px;
    cursor: pointer;
    position: relative;
    transition: all 0.1s;
    box-shadow: 4px 4px 0 var(--accent);
    letter-spacing: 1px;
  }
  .pixel-btn:hover {
    background: var(--accent);
    color: var(--bg);
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 rgba(232,200,74,0.5);
  }
  .pixel-btn:active { transform: translate(2px, 2px); box-shadow: none; }

  /* Scene panel */
  #scene-panel {
    background: var(--panel);
    border: 3px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .scene-art {
    height: 200px;
    position: relative;
    background: linear-gradient(180deg, #0d0d20 0%, #1a1030 60%, #2a1040 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    overflow: hidden;
  }

  /* Location label */
  .location-tag {
    position: absolute;
    top: 10px; left: 10px;
    font-size: 9px;
    color: var(--accent2);
    border: 2px solid var(--accent2);
    padding: 4px 8px;
    background: rgba(0,0,0,0.7);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Progress bar */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 2px solid var(--border);
    background: rgba(0,0,0,0.3);
  }
  .progress-label { font-size: 9px; color: var(--dim); white-space: nowrap; }
  .progress-bar {
    flex: 1;
    height: 10px;
    background: rgba(255,255,255,0.05);
    border: 2px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute; top: 0; right: 0;
    width: 4px; height: 100%;
    background: rgba(255,255,255,0.6);
    animation: scanl 1s infinite;
  }
  @keyframes scanl { 0%,100%{opacity:1} 50%{opacity:0} }
  .score-display { font-size: 9px; color: var(--accent); white-space: nowrap; }

  /* Dialogue box */
  .dialogue-box {
    border-top: 3px solid var(--border);
    padding: 16px;
    min-height: 110px;
    position: relative;
    background: rgba(0,0,0,0.4);
  }
  .speaker-name {
    font-size: 10px;
    color: var(--accent);
    margin-bottom: 10px;
    text-shadow: 0 0 10px var(--accent);
  }
  .dialogue-text {
    font-size: 11px;
    line-height: 2.2;
    color: var(--text);
    min-height: 56px;
  }
  .continue-prompt {
    position: absolute;
    bottom: 12px; right: 16px;
    font-size: 9px;
    color: var(--accent);
    animation: blink 0.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Question panel */
  #question-panel {
    background: var(--panel);
    border: 3px solid var(--border);
  }
  .q-header {
    background: rgba(0,0,0,0.4);
    border-bottom: 2px solid var(--border);
    padding: 12px 16px;
    font-size: 10px;
    color: var(--accent2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .question-text {
    padding: 16px;
    font-size: 11px;
    line-height: 2.2;
    color: var(--text);
    border-bottom: 2px solid var(--border);
    min-height: 80px;
  }
  .answers-grid {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .answer-btn {
    background: rgba(255,255,255,0.03);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.1s;
    line-height: 2;
    position: relative;
    padding-left: 34px;
  }
  .answer-btn::before {
    content: attr(data-key);
    position: absolute;
    left: 12px;
    color: var(--accent);
    font-size: 10px;
  }
  .answer-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,200,74,0.08);
    transform: translateX(3px);
  }
  .answer-btn.correct {
    border-color: var(--correct);
    color: var(--correct);
    background: rgba(46,204,113,0.1);
  }
  .answer-btn.wrong {
    border-color: var(--wrong);
    color: var(--wrong);
    background: rgba(231,76,60,0.1);
  }
  .answer-btn:disabled { cursor: default; }

  /* Feedback box */
  .feedback-box {
    margin: 0 12px 12px;
    padding: 12px 14px;
    font-size: 10px;
    line-height: 2.2;
    border: 2px solid var(--border);
    display: none;
    background: rgba(0,0,0,0.5);
  }
  .feedback-box.show { display: block; }
  .feedback-box.correct-fb { border-color: var(--correct); color: var(--correct); }
  .feedback-box.wrong-fb { border-color: var(--wrong); color: var(--wrong); }

  .next-btn-row { padding: 0 12px 14px; display: none; }
  .next-btn-row.show { display: block; }

  /* End screen */
  #end-screen {
    text-align: center;
    padding: 40px 24px;
    background: var(--panel);
    border: 3px solid var(--border);
  }
  .end-title { font-size: 15px; color: var(--accent); margin-bottom: 20px; line-height: 1.8; text-shadow: 0 0 20px var(--accent); }
  .end-score { font-size: 22px; color: var(--accent2); margin-bottom: 16px; }
  .end-rank { font-size: 11px; color: var(--accent3); margin-bottom: 30px; }
  .end-text { font-size: 10px; color: var(--dim); line-height: 2.5; margin-bottom: 30px; max-width: 560px; margin-left: auto; margin-right: auto; }

  /* Pixel sprites via CSS */
  .sprite-greg {
    width: 32px; height: 48px;
    position: relative;
    margin: 0 8px;
    image-rendering: pixelated;
    flex-shrink: 0;
  }

  /* Animations */
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  @keyframes glow {
    0%,100%{box-shadow:0 0 10px var(--accent)}
    50%{box-shadow:0 0 25px var(--accent),0 0 50px rgba(232,200,74,0.3)}
  }
  .shake { animation: shake 0.4s ease; }

  .hidden { display: none !important; }

  /* Pixel art scene elements */
  .scene-floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30px;
  }

  .floating {
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }

  canvas {
    display: block;
    image-rendering: pixelated;
  }

  .chapter-banner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.9);
    border: 3px solid var(--accent);
    padding: 16px 24px;
    text-align: center;
    z-index: 10;
    animation: bannerIn 0.5s ease;
    box-shadow: 0 0 30px rgba(232,200,74,0.4);
    pointer-events: none;
  }
  .chapter-banner .ch-num { font-size: 6px; color: var(--dim); margin-bottom: 8px; }
  .chapter-banner .ch-title { font-size: 9px; color: var(--accent); line-height: 1.8; }
  @keyframes bannerIn { from{opacity:0;transform:translate(-50%,-60%)} to{opacity:1;transform:translate(-50%,-50%)} }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="game">

  <!-- TITLE SCREEN -->
  <div id="title-screen">
    <div class="title-logo">✦ THE ORDER OF ✦<br>THE DOUBLE HELIX</div>
    <div class="title-sub">A Quiz RPG of Genomic Secrets</div>
    <div class="title-desc">
      A suburban dad walks into a hardware store.<br>
      He walks out as something... more.<br>
      Answer 10 questions to survive.
    </div>
    <button class="pixel-btn" onclick="startGame()">▶ PRESS TO BEGIN</button>
  </div>

  <!-- SCENE PANEL -->
  <div id="scene-panel" class="hidden">
    <div class="progress-row">
      <span class="progress-label">RANK</span>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <span class="score-display" id="score-display">0/10</span>
    </div>
    <div class="scene-art" id="scene-art">
      <div class="location-tag" id="location-tag">LOCATION</div>
      <canvas id="scene-canvas" width="760" height="200"></canvas>
      <div class="chapter-banner hidden" id="chapter-banner">
        <div class="ch-num" id="ch-num"></div>
        <div class="ch-title" id="ch-title"></div>
      </div>
    </div>
    <div class="dialogue-box" id="dialogue-box">
      <div class="speaker-name" id="speaker-name"></div>
      <div class="dialogue-text" id="dialogue-text"></div>
      <div class="continue-prompt" id="continue-prompt">▼ CLICK TO CONTINUE</div>
    </div>
  </div>

  <!-- QUESTION PANEL -->
  <div id="question-panel" class="hidden">
    <div class="q-header">
      <span id="q-num">QUESTION 1 / 10</span>
      <span id="q-cat" style="color:var(--dim);font-size:6px;"></span>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="answers-grid" id="answers-grid"></div>
    <div class="feedback-box" id="feedback-box"></div>
    <div class="next-btn-row" id="next-btn-row">
      <button class="pixel-btn" style="width:100%;font-size:7px;box-shadow:4px 4px 0 var(--accent2);border-color:var(--accent2);color:var(--accent2);" onclick="advanceStory()">
        CONTINUE THE QUEST ▶
      </button>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="end-screen" class="hidden">
    <div class="end-title">QUEST COMPLETE</div>
    <div class="end-score" id="final-score"></div>
    <div class="end-rank" id="final-rank"></div>
    <div class="end-text" id="final-text"></div>
    <button class="pixel-btn" onclick="location.reload()">↺ PLAY AGAIN</button>
  </div>

</div>

<script>
// ============================================================
// STORY DATA
// ============================================================

const SCENES = [
  {
    location: "BUNNINGS WAREHOUSE - AISLE 7",
    speaker: "NARRATOR",
    bg: "hardware",
    lines: [
      "It is a Tuesday. Greg Pemberton, 43, needs a drill bit.",
      "He finds one. He heads to the self-checkout.",
      "The machine says: 'Do you have a loyalty card?'",
      "Greg says, by total accident: 'The SNP is biallelic.'",
      "The machine beeps three times. A panel opens in the floor.",
      "A robed figure rises from the earth, holding a clipboard.",
    ]
  },
  {
    location: "BUNNINGS WAREHOUSE - AISLE 7",
    speaker: "ROBED FIGURE (GERALD)",
    bg: "hardware",
    lines: [
      "Welcome, Initiate. We have waited 12,000 years for you.",
      "I am Gerald. I am the Grand Vizier of The Order of the Double Helix.",
      "We meet every fortnight in the fertiliser section.",
      "Last week we lost three members to a discounted mulch sale.",
      "You must answer our sacred questions to join. The first is simple.",
      "Or is it? Gerald winks. Gerald has three eyelids. Greg does not mention this.",
    ]
  },
];

const QUESTIONS = [
  {
    q: "On average, human genomes are how similar to each other?",
    cat: "HUMAN VARIATION",
    answers: ["98.5% identical", "99.9% identical", "95.0% identical", "100% identical"],
    correct: 1,
    correctFeedback: "CORRECT! Gerald stamps your card. You are now a Bronze Helix. He gives you a hi-vis vest with a DNA pattern.",
    wrongFeedback: "WRONG! Gerald sighs. A trapdoor opens. You fall into a room full of bubble wrap. It takes 4 minutes to escape.",
    story: {
      location: "THE SACRED BACK ROOM (behind plumbing supplies)",
      speaker: "GERALD",
      bg: "backroom",
      lines: [
        "Excellent work, Bronze Helix! The ancient texts are pleased.",
        "Now follow me through the garden hose section.",
        "The Order's headquarters is through the second door past the outdoor furniture.",
        "Watch out for Kevin. Kevin is a rival from the BLAST Brotherhood.",
        "He will try to distract you with a very good deal on decking. Stay strong.",
      ]
    }
  },
  {
    q: "What does 'SNP' stand for?",
    cat: "CORE CONCEPTS",
    answers: [
      "Single Nucleotide Polymorphism",
      "Systematic Nucleotide Protocol",
      "Sequential Nucleotide Pattern",
      "Special Nucleotide Procedure"
    ],
    correct: 0,
    correctFeedback: "CORRECT! The Order applauds. One member applauds too enthusiastically and knocks over a shelf of PVC pipe fittings.",
    wrongFeedback: "WRONG! Gerald removes your hi-vis vest. He hands you a smaller, sadder vest. It is pink. It says CADET.",
    story: {
      location: "ORDER HEADQUARTERS (the manager's office, Brian is on leave)",
      speaker: "GRAND ORACLE ROOMBA",
      bg: "hq",
      lines: [
        "BZZZT. I am the Grand Oracle. I am a Roomba with googly eyes.",
        "I have been granted wisdom beyond mortal comprehension.",
        "Also I have found eleven hair ties under the couch. They are yours now.",
        "The ritual demands you answer another question, initiate.",
        "Do not be distracted by the fact that I am also vacuuming. Multitasking is sacred.",
      ]
    }
  },
  {
    q: "A SNP is typically defined as a variant with a minor allele frequency greater than what percentage?",
    cat: "SNP DEFINITION",
    answers: ["0.1%", "5%", "1%", "10%"],
    correct: 2,
    correctFeedback: "CORRECT! The Roomba plays a victory jingle. It is 'Dancing Queen'. Nobody questions this.",
    wrongFeedback: "WRONG! The Roomba bumps into your foot repeatedly, which is both the punishment and an accident.",
    story: {
      location: "THE FORBIDDEN FERTILISER AISLE",
      speaker: "KEVIN (rival agent)",
      bg: "aisle",
      lines: [
        "Hey. Hey mate. You look like you could use some quality decking.",
        "Also I couldn't help but overhear. You're with the Double Helix mob.",
        "I'm Kevin. BLAST Brotherhood. We do sequence alignment on weekends.",
        "We also do a very good sausage sizzle. Better than theirs, frankly.",
        "Anyway. Don't think this conversation is over. I have a question too.",
        "WAIT NO THAT'S THEIR THING. Never mind. Here's a coupon for mulch.",
      ]
    }
  },
  {
    q: "Approximately how many SNPs have been identified in humans?",
    cat: "SNP ABUNDANCE",
    answers: ["More than 35 million", "About 5 million", "About 1 million", "More than 500 million"],
    correct: 0,
    correctFeedback: "CORRECT! Gerald does a little dance. It is extremely unexpected. It continues for 45 seconds.",
    wrongFeedback: "WRONG! Gerald shakes his head in all three eyelid disappointment. You lose 1 hi-vis vest privilege.",
    story: {
      location: "THE HARDWARE STORE ROOFTOP (unauthorised)",
      speaker: "MYSTERIOUS PIGEON",
      bg: "rooftop",
      lines: [
        "Coooo. I am not just a pigeon.",
        "I carry the sacred scrolls. They are a printout of the dbSNP homepage.",
        "My ancestors have carried these scrolls since 2002 when Gerald printed them.",
        "The ink is a little faded because Gerald used 'draft mode' to save toner.",
        "Nevertheless. The wisdom endures. As does Gerald's frugality.",
        "The next question comes from the scrolls. Listen well.",
      ]
    }
  },
  {
    q: "Each variant in dbSNP is assigned a unique identifier beginning with which prefix?",
    cat: "DATABASE LITERACY",
    answers: ["snp", "db", "rs", "var"],
    correct: 2,
    correctFeedback: "CORRECT! The pigeon erupts into confetti. This is biologically unprecedented. Science is shaken.",
    wrongFeedback: "WRONG! The pigeon stares at you. It has very judgemental eyes. It does not stop staring.",
    story: {
      location: "THE PAINT MIXING STATION (code name: THE CHAMBER)",
      speaker: "GREG'S WIFE (DIANE)",
      bg: "chamber",
      lines: [
        "*Greg's phone rings. It is his wife, Diane.*",
        "DIANE: Greg, did you get the drill bit?",
        "GREG: I've joined a secret genomics society.",
        "DIANE: Again?",
        "GREG: ...Again?",
        "DIANE: Greg. I founded the Order. I am the Supreme Helix. I thought you knew.",
        "GREG: We've been married for 19 years.",
        "DIANE: The Order is 23 years old, Greg. Do the math.",
      ]
    }
  },
  {
    q: "In Hardy-Weinberg equilibrium with allele frequencies p and q, what does '2pq' represent?",
    cat: "HARDY-WEINBERG",
    answers: [
      "Frequency of homozygous dominant",
      "Frequency of heterozygotes",
      "Frequency of homozygous recessive",
      "Total allele frequency"
    ],
    correct: 1,
    correctFeedback: "CORRECT! Diane appears from behind the paint mixing machine. She was there the whole time. 'Well done,' she says.",
    wrongFeedback: "WRONG! Diane sighs through the phone. Gerald also sighs. Even Kevin sighs from the fertiliser aisle. A lot of sighing.",
    story: {
      location: "THE OUTDOOR FURNITURE DISPLAY (a good ambience for drama)",
      speaker: "DIANE (SUPREME HELIX)",
      bg: "outdoor",
      lines: [
        "Diane arrives. She is wearing the most impressive hi-vis vest Greg has ever seen.",
        "It has epaulettes. There is a DNA emblem. It has interior pockets.",
        "DIANE: Sit down, Greg. In the patio chair. The teak one, not the plastic.",
        "GREG: Is this why you always stayed late at Bunnings?",
        "DIANE: I wasn't at Bunnings. I was at the UNDERGROUND ORDER CHAMBER BENEATH BUNNINGS.",
        "GREG: Same thing, then.",
        "DIANE: Greg, you must face the Penultimate Trial. Are you ready?",
      ]
    }
  },
  {
    q: "Which of the following is NOT an assumption of Hardy-Weinberg equilibrium?",
    cat: "HARDY-WEINBERG",
    answers: [
      "Random mating",
      "No migration",
      "Small finite population size",
      "No selection"
    ],
    correct: 2,
    correctFeedback: "CORRECT! The outdoor furniture display erupts in genuine applause. Nobody understands where all these people came from.",
    wrongFeedback: "WRONG! A garden gnome on the display shelf slowly rotates to face you. It does not look pleased.",
    story: {
      location: "THE SELF-CHECKOUT MACHINE (it all comes full circle)",
      speaker: "THE SELF-CHECKOUT MACHINE",
      bg: "checkout",
      lines: [
        "MACHINE: Unexpected item in bagging area.",
        "MACHINE: The unexpected item is: your new sense of purpose.",
        "MACHINE: Please wait for assistance.",
        "MACHINE: Just kidding. You have passed seven trials. You need no assistance.",
        "MACHINE: I have been the Order's secretary since 2009.",
        "MACHINE: Gerald taught me to love. I taught Gerald to use contactless payment.",
        "MACHINE: One final question remains. Do not mess this up. I have feelings.",
      ]
    }
  },
  {
    q: "Which statistical test is used to check if a SNP deviates from Hardy-Weinberg expectations?",
    cat: "STATISTICAL METHODS",
    answers: [
      "T-test",
      "ANOVA",
      "Chi-square goodness-of-fit test",
      "Mann-Whitney U test"
    ],
    correct: 2,
    correctFeedback: "CORRECT! The machine beeps joyfully seventeen times and dispenses a receipt that just says 'WELL DONE GREG'.",
    wrongFeedback: "WRONG! The machine prints a receipt. It says 'HAVE YOU TRIED TURNING YOURSELF OFF AND ON AGAIN'. You have not.",
    story: {
      location: "AISLE 7 (AGAIN) (journey complete)",
      speaker: "GERALD",
      bg: "hardware",
      lines: [
        "Gerald emerges from the floor again, this time dramatically.",
        "He is holding the drill bit you originally came for.",
        "GERALD: One question remains, Initiate-Who-Is-Now-A-Grand-Initiate.",
        "GERALD: It is about population genetics.",
        "GERALD: And also about your destiny.",
        "GERALD: Mostly the population genetics, though. The destiny part was a bit much.",
        "GERALD: Kevin voted against the destiny line. He was right. Kevin is actually great.",
      ]
    }
  },
  {
    q: "Allele frequencies can vary between human populations due to several forces. Which of the following IS one of them?",
    cat: "POPULATION GENETICS",
    answers: [
      "Photosynthesis",
      "Genetic drift",
      "Plate tectonics",
      "Collective bargaining"
    ],
    correct: 1,
    correctFeedback: "CORRECT! Gerald weeps openly. 'We chose well,' he says. Kevin nods from the fertiliser aisle. Solidarity.",
    wrongFeedback: "WRONG! A tumbleweed rolls through Aisle 7. Inside the tumbleweed: Kevin, shaking his head slowly.",
    story: {
      location: "THE CEREMONIAL FORECOURT (carpark, near the trolleys)",

function drawScene(ctx, bg) {
  const w = 760, h = 200;
  ctx.clearRect(0,0,w,h);

  const scenes = {
    hardware: () => {
      // Sky/ceiling
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#0d0d1a'); g.addColorStop(1,'#1a1228');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      // Floor
      ctx.fillStyle = '#1a1210'; ctx.fillRect(0,160,w,40);
      ctx.fillStyle = '#251a14'; ctx.fillRect(0,155,w,6);
      // Shelves
      drawShelf(ctx, 40, 60, 200);
      drawShelf(ctx, 300, 40, 200);
      drawShelf(ctx, 560, 70, 180);
      // Aisle stripes on floor
      ctx.fillStyle = '#ffa50020';
      for(let i=0;i<w;i+=60) { ctx.fillRect(i,162,30,36); }
      // Overhead lights
      for(let i=80;i<w;i+=160) {
        ctx.fillStyle='#ffe08840';
        ctx.fillRect(i-30,0,60,4);
        // light cone
        ctx.fillStyle='rgba(255,220,120,0.04)';
        ctx.beginPath();
        ctx.moveTo(i-30,4); ctx.lineTo(i+30,4);
        ctx.lineTo(i+70,h); ctx.lineTo(i-70,h);
        ctx.fill();
      }
      drawGreg(ctx, 350, 120, '#4a9eff');
      drawGerald(ctx, 500, 115);
    },
    backroom: () => {
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#0a0a14'); g.addColorStop(1,'#141024');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#14100a'; ctx.fillRect(0,155,w,45);
      // boxes
      drawBox(ctx, 60, 110, '#2a1e14', '#4a3224');
      drawBox(ctx, 120, 95, '#1e2a14', '#3a4a24');
      drawBox(ctx, 580, 105, '#2a1420', '#4a2440');
      drawBox(ctx, 640, 120, '#14202a', '#24404a');
      // DNA symbol on wall
      drawDNA(ctx, 380, 60);
      drawGreg(ctx, 300, 120, '#4a9eff');
      drawGerald(ctx, 440, 118);
    },
    hq: () => {
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#0a0a20'); g.addColorStop(1,'#100820');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#0e0a1a'; ctx.fillRect(0,155,w,45);
      // fancy floor
      for(let i=0;i<w;i+=40) {
        ctx.fillStyle = i%80===0 ? '#1a1030' : '#120820';
        ctx.fillRect(i,155,40,45);
      }
      // Roomba
      drawRoomba(ctx, 380, 138);
      drawGreg(ctx, 250, 120, '#4a9eff');
      // banner
      ctx.fillStyle='#e8c84a20';
      ctx.fillRect(50,10,660,50);
      ctx.strokeStyle='#e8c84a'; ctx.lineWidth=2;
      ctx.strokeRect(50,10,660,50);
      ctx.fillStyle='#e8c84a'; ctx.font='bold 12px monospace';
      ctx.textAlign='center'; ctx.fillText('ORDER HEADQUARTERS — SANCTUM OF SEQUENCES',380,40);
    },
    aisle: () => {
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#0d0d1a'); g.addColorStop(1,'#1a1228');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#1a1210'; ctx.fillRect(0,160,w,40);
      drawShelf(ctx, 50, 50, 300, '#2a2a10', '#4a4a20', 'FERTILISER');
      drawShelf(ctx, 420, 60, 290, '#2a2a10', '#4a4a20', 'MULCH');
      drawGreg(ctx, 280, 120, '#4a9eff');
      drawKevin(ctx, 430, 122);
    },
    rooftop: () => {
      // Sky
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#0a0a30'); g.addColorStop(0.6,'#200a30'); g.addColorStop(1,'#300a20');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      // Stars
      for(let i=0;i<60;i++){
        ctx.fillStyle='rgba(255,255,220,'+(0.3+Math.random()*0.5)+')';
        ctx.fillRect(Math.random()*w,Math.random()*100,2,2);
      }
      // Rooftop
      ctx.fillStyle='#1e1e1e'; ctx.fillRect(0,145,w,55);
      ctx.fillStyle='#2a2a2a'; ctx.fillRect(0,140,w,8);
      // AC units etc
      drawBox(ctx, 80,100,'#1a1a2a','#2a2a3a'); drawBox(ctx,620,105,'#1a2a1a','#2a3a2a');
      drawGreg(ctx, 350, 110, '#4a9eff');
      drawPigeon(ctx, 480, 112);
    },
    chamber: () => {
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#100818'); g.addColorStop(1,'#200818');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#0e0808'; ctx.fillRect(0,155,w,45);
      // paint swatches on wall
      const cols=['#ff4a4a','#4aff4a','#4a4aff','#ffff4a','#ff4aff','#4affff','#ff8a4a'];
      for(let i=0;i<cols.length;i++) {
        ctx.fillStyle=cols[i]+'60';
        ctx.fillRect(40+i*80,20,60,80);
        ctx.strokeStyle=cols[i]; ctx.lineWidth=1;
        ctx.strokeRect(40+i*80,20,60,80);
      }
      drawGreg(ctx, 300, 120, '#4a9eff');
      // Phone glow
      ctx.fillStyle='rgba(74,158,255,0.15)';
      ctx.fillRect(280,90,30,45);
      ctx.fillStyle='#4a9eff'; ctx.fillRect(290,95,10,5);
    },
    outdoor: () => {
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#0a1a0a'); g.addColorStop(1,'#1a2a1a');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#1a1408'; ctx.fillRect(0,158,w,42);
      // Fake grass
      ctx.fillStyle='#1a2a10';
      for(let i=0;i<w;i+=8){ ctx.fillRect(i,155,4,8); }
      // Patio chairs
      drawChair(ctx,120,120); drawChair(ctx,200,120);
      drawChair(ctx,520,120); drawChair(ctx,600,120);
      // Table
      ctx.fillStyle='#5a3a14'; ctx.fillRect(300,130,160,10);
      ctx.fillStyle='#4a2a0a'; ctx.fillRect(360,140,4,25); ctx.fillRect(400,140,4,25);
      drawGreg(ctx, 270, 108, '#4a9eff');
      drawDiane(ctx, 450, 108);
    },
    checkout: () => {
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#0a0a20'); g.addColorStop(1,'#0a1420');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#101010'; ctx.fillRect(0,155,w,45);
      // Checkout machine
      ctx.fillStyle='#1a3a1a'; ctx.fillRect(320,40,120,115);
      ctx.fillStyle='#2a4a2a'; ctx.fillRect(330,50,100,60);
      // Screen glow
      ctx.fillStyle='rgba(74,232,176,0.2)'; ctx.fillRect(330,50,100,60);
      ctx.fillStyle='#4ae8b0'; ctx.font='8px monospace'; ctx.textAlign='center';
      ctx.fillText('SCANNING...',380,85); ctx.fillText('WISDOM',380,98);
      // Bagging area
      ctx.fillStyle='#101a10'; ctx.fillRect(320,155,120,10);
      drawGreg(ctx, 230, 118, '#4a9eff');
    },
    carpark: () => {
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#1a0a2a'); g.addColorStop(0.5,'#0a1a1a'); g.addColorStop(1,'#1a1a0a');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      // Tarmac
      ctx.fillStyle='#141414'; ctx.fillRect(0,155,w,45);
      // Line markings
      ctx.fillStyle='#e8c84a40';
      for(let i=50;i<w;i+=100) { ctx.fillRect(i,158,60,3); }
      // Trolleys
      drawTrolley(ctx, 80, 128); drawTrolley(ctx, 650, 128);
      // Sky gradient with sunset
      const sg = ctx.createLinearGradient(0,0,0,155);
      sg.addColorStop(0,'rgba(232,74,122,0.1)'); sg.addColorStop(1,'rgba(74,232,176,0.05)');
      ctx.fillStyle=sg; ctx.fillRect(0,0,w,155);
      // Stars
      for(let i=0;i<40;i++){
        ctx.fillStyle='rgba(255,255,255,'+(0.2+Math.random()*0.4)+')';
        ctx.fillRect(Math.random()*w,Math.random()*80,2,2);
      }
      drawGreg(ctx, 300, 110, '#ffd700'); // golden greg
      drawDiane(ctx, 430, 108);
      drawGerald(ctx, 560, 112);
    }
  };

  (scenes[bg] || scenes.hardware)();
}

function drawShelf(ctx, x, y, w2, bgCol='#2a1a0a', fgCol='#3a2a14', label='') {
  ctx.fillStyle=bgCol; ctx.fillRect(x,y,w2,90);
  ctx.fillStyle=fgCol;
  ctx.fillRect(x,y,w2,6);
  ctx.fillRect(x,y+35,w2,6);
  ctx.fillRect(x,y+70,w2,6);
  // items
  const cols=['#e84a4a','#4ae84a','#4a4ae8','#e8e84a','#e84ae8'];
  for(let i=0;i<6;i++){
    ctx.fillStyle=cols[i%5]+'80';
    ctx.fillRect(x+8+i*(w2/7),y+10,w2/8-4,22);
  }
  if(label){
    ctx.fillStyle='#ffffff40'; ctx.font='7px monospace'; ctx.textAlign='center';
    ctx.fillText(label,x+w2/2,y+52);
  }
}

function drawBox(ctx,x,y,c1,c2){
  const bh = 200-y-45;
  ctx.fillStyle=c1; ctx.fillRect(x,y,50,bh);
  ctx.fillStyle=c2; ctx.fillRect(x,y,50,8);
  ctx.strokeStyle=c2; ctx.lineWidth=1; ctx.strokeRect(x,y,50,bh);
}

function drawDNA(ctx, cx, cy) {
  ctx.strokeStyle='#4ae8b060'; ctx.lineWidth=2;
  for(let i=0;i<8;i++){
    const t=i*10;
    ctx.beginPath();
    ctx.moveTo(cx-20+Math.sin(i*0.8)*15,cy-40+t);
    ctx.lineTo(cx+20-Math.sin(i*0.8)*15,cy-40+t);
    ctx.stroke();
  }
  ctx.strokeStyle='#e8c84a40';
  ctx.beginPath();
  for(let i=0;i<=20;i++){ctx.lineTo(cx+Math.sin(i*0.5)*18,cy-40+i*4);}
  ctx.stroke();
  ctx.strokeStyle='#4ae8b060';
  ctx.beginPath();
  for(let i=0;i<=20;i++){ctx.lineTo(cx-Math.sin(i*0.5)*18,cy-40+i*4);}
  ctx.stroke();
}

function drawGreg(ctx, x, y, shirtCol='#4a9eff') {
  // pixel person
  const s=4;
  // body
  ctx.fillStyle=shirtCol; ctx.fillRect(x-s*2,y-s*8,s*4,s*5);
  // head
  ctx.fillStyle='#f0c060'; ctx.fillRect(x-s*2,y-s*12,s*4,s*4);
  // hair
  ctx.fillStyle='#5a3a10'; ctx.fillRect(x-s*2,y-s*12,s*4,s);
  // eyes
  ctx.fillStyle='#2a1a08'; ctx.fillRect(x-s,y-s*10,s,s); ctx.fillRect(x+s*0,y-s*10,s,s);
  // legs
  ctx.fillStyle='#3a2a4a'; ctx.fillRect(x-s*2,y-s*3,s*2,s*3); ctx.fillRect(x,y-s*3,s*2,s*3);
  // hi-vis
  ctx.fillStyle='rgba(255,165,0,0.5)'; ctx.fillRect(x-s*2,y-s*8,s*4,2);
  ctx.fillRect(x-s*2,y-s*6,s*4,1);
}

function drawGerald(ctx, x, y) {
  const s=4;
  ctx.fillStyle='#2a0a4a'; ctx.fillRect(x-s*2,y-s*10,s*4,s*7);
  ctx.fillStyle='#f0c060'; ctx.fillRect(x-s*2,y-s*14,s*4,s*4);
  ctx.fillStyle='#1a001a'; ctx.fillRect(x-s*2,y-s*14,s*4,s);
  ctx.fillStyle='#ff00ff'; ctx.fillRect(x-s,y-s*12,s,s); ctx.fillRect(x+s*0,y-s*12,s,s);
  // third eyelid hint
  ctx.fillStyle='rgba(255,0,255,0.4)'; ctx.fillRect(x-s,y-s*11,s*2,s/2);
  ctx.fillStyle='#3a0a5a'; ctx.fillRect(x-s*2,y-s*3,s*2,s*3); ctx.fillRect(x,y-s*3,s*2,s*3);
  // robes flowing
  ctx.fillStyle='#1a0a3a60';
  ctx.fillRect(x-s*3,y-s*8,s*6,s*8);
}

function drawDiane(ctx, x, y) {
  const s=4;
  // epic hi-vis
  ctx.fillStyle='#e8a020'; ctx.fillRect(x-s*2,y-s*8,s*4,s*5);
  // epaulettes
  ctx.fillStyle='#ffd700'; ctx.fillRect(x-s*3,y-s*8,s,s*2); ctx.fillRect(x+s*2,y-s*8,s,s*2);
  ctx.fillStyle='#f0c060'; ctx.fillRect(x-s*2,y-s*12,s*4,s*4);
  ctx.fillStyle='#1a0a0a'; ctx.fillRect(x-s*2,y-s*12,s*4,s);
  ctx.fillStyle='#1a1a80'; ctx.fillRect(x-s,y-s*10,s,s); ctx.fillRect(x+s*0,y-s*10,s,s);
  ctx.fillStyle='#3a2a4a'; ctx.fillRect(x-s*2,y-s*3,s*2,s*3); ctx.fillRect(x,y-s*3,s*2,s*3);
  // DNA badge
  ctx.fillStyle='#4ae8b0'; ctx.fillRect(x-s,y-s*6,s*2,s*2);
}

function drawKevin(ctx, x, y) {
  const s=4;
  ctx.fillStyle='#4a2020'; ctx.fillRect(x-s*2,y-s*8,s*4,s*5);
  ctx.fillStyle='#f5c070'; ctx.fillRect(x-s*2,y-s*12,s*4,s*4);
  ctx.fillStyle='#2a2a0a'; ctx.fillRect(x-s*2,y-s*12,s*4,s);
  ctx.fillStyle='#0a0a20'; ctx.fillRect(x-s,y-s*10,s,s); ctx.fillRect(x+s*0,y-s*10,s,s);
  ctx.fillStyle='#2a1a2a'; ctx.fillRect(x-s*2,y-s*3,s*2,s*3); ctx.fillRect(x,y-s*3,s*2,s*3);
  // BLAST badge
  ctx.fillStyle='#e84a4a'; ctx.fillRect(x-s,y-s*6,s*2,s*2);
}

function drawRoomba(ctx, x, y) {
  ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.arc(x,y,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3a3a3a'; ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff4a4a'; ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2); ctx.fill();
  // googly eyes
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-10,y-8,6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+10,y-8,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.arc(x-9,y-7,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+11,y-9,3,0,Math.PI*2); ctx.fill();
  // wisdom glow
  ctx.strokeStyle='rgba(232,200,74,0.3)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(x,y,32,0,Math.PI*2); ctx.stroke();
}

function drawPigeon(ctx, x, y) {
  const s=3;
  ctx.fillStyle='#8a8a9a'; ctx.fillRect(x-s*3,y-s*4,s*6,s*4);
  ctx.fillStyle='#9a9aaa'; ctx.fillRect(x-s*2,y-s*7,s*4,s*3);
  ctx.fillStyle='#f0a0a0'; ctx.fillRect(x-s,y-s*5,s,s);
  ctx.fillStyle='#e8c84a'; ctx.fillRect(x-s*4,y-s*2,s*2,s*4); ctx.fillRect(x+s*2,y-s*2,s*2,s*4);
  // scroll
  ctx.fillStyle='#f0e0c0'; ctx.fillRect(x+s*4,y-s*5,s*4,s*5);
  ctx.fillStyle='#4a2a10'; ctx.fillRect(x+s*4,y-s*5,s,s*5); ctx.fillRect(x+s*7,y-s*5,s,s*5);
}

function drawChair(ctx, x, y) {
  ctx.fillStyle='#5a3a14'; ctx.fillRect(x,y,40,6); // seat
  ctx.fillRect(x,y-40,6,40); // back
  ctx.fillStyle='#4a2a0a';
  ctx.fillRect(x+2,y+6,4,25); ctx.fillRect(x+34,y+6,4,25); // legs
}

function drawTrolley(ctx, x, y) {
  ctx.strokeStyle='#6a6a7a'; ctx.lineWidth=2;
  ctx.strokeRect(x,y,40,30);
  ctx.fillStyle='#3a3a4a'; ctx.fillRect(x,y+28,40,4);
  ctx.fillStyle='#5a5a6a'; ctx.beginPath(); ctx.arc(x+8,y+36,6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+32,y+36,6,0,Math.PI*2); ctx.fill();
}

// ============================================================
// GAME STATE
// ============================================================

let gameState = {
  screen: 'title',
  questionIdx: 0,
  score: 0,
  dialogueIdx: 0,
  currentLines: [],
  waitingForQ: false,
  answered: false,
};

function startGame() {
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('scene-panel').classList.remove('hidden');
  loadScene(0);
}

function loadScene(idx) {
  const data = SCENES[idx];
  gameState.currentLines = data.lines;
  gameState.dialogueIdx = 0;
  gameState.waitingForQ = false;
  renderScene(data);
  showDialogue(data.speaker, data.lines[0]);

  // Show chapter banner for first scene
  if(idx === 0) {
    showChapterBanner('PROLOGUE', 'THE HARDWARE STORE INCIDENT');
  }
}

function renderScene(data) {
  document.getElementById('location-tag').textContent = data.location;
  const canvas = document.getElementById('scene-canvas');
  const ctx = canvas.getContext('2d');
  drawScene(ctx, data.bg);
}

function showChapterBanner(num, title) {
  const banner = document.getElementById('chapter-banner');
  document.getElementById('ch-num').textContent = num;
  document.getElementById('ch-title').textContent = title;
  banner.classList.remove('hidden');
  setTimeout(() => banner.classList.add('hidden'), 2500);
}

function showDialogue(speaker, text) {
  document.getElementById('speaker-name').textContent = '▶ ' + speaker;
  document.getElementById('dialogue-text').textContent = text;
  document.getElementById('continue-prompt').style.display = 'block';
}

function advanceDialogue() {
  if(gameState.waitingForQ) return;

  // Check if we're in a scene or story interlude
  if(gameState.inStory) {
    gameState.dialogueIdx++;
    if(gameState.dialogueIdx < gameState.currentLines.length) {
      showDialogue(gameState.currentSpeaker, gameState.currentLines[gameState.dialogueIdx]);
    } else {
      // Done with interlude, show question
      gameState.inStory = false;
      showQuestion(gameState.questionIdx);
    }
    return;
  }

  // Initial scenes
  gameState.dialogueIdx++;
  if(gameState.dialogueIdx < gameState.currentLines.length) {
    showDialogue(
      gameState.dialogueIdx < 6 ? SCENES[0].speaker : SCENES[1].speaker,
      gameState.currentLines[gameState.dialogueIdx]
    );
  } else if(gameState.currentLines === SCENES[0].lines) {
    // Move to scene 2
    gameState.currentLines = SCENES[1].lines;
    gameState.dialogueIdx = 0;
    showDialogue(SCENES[1].speaker, SCENES[1].lines[0]);
  } else {
    // Start questions
    gameState.waitingForQ = true;
    showQuestion(0);
  }
}

function showQuestion(idx) {
  document.getElementById('scene-panel').classList.add('hidden');
  document.getElementById('question-panel').classList.remove('hidden');

  const q = QUESTIONS[idx];
  document.getElementById('q-num').textContent = `QUESTION ${idx+1} / 10`;
  document.getElementById('q-cat').textContent = q.cat;
  document.getElementById('question-text').textContent = q.q;

  const grid = document.getElementById('answers-grid');
  grid.innerHTML = '';
  const keys = ['A','B','C','D'];
  q.answers.forEach((a,i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.setAttribute('data-key', keys[i]);
    btn.textContent = a;
    btn.onclick = () => answerQuestion(i);
    grid.appendChild(btn);
  });

  document.getElementById('feedback-box').className = 'feedback-box';
  document.getElementById('feedback-box').textContent = '';
  document.getElementById('next-btn-row').className = 'next-btn-row';
  gameState.answered = false;
}

function answerQuestion(choice) {
  if(gameState.answered) return;
  gameState.answered = true;

  const q = QUESTIONS[gameState.questionIdx];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = choice === q.correct;
  btns[choice].classList.add(isCorrect ? 'correct' : 'wrong');
  if(!isCorrect) btns[q.correct].classList.add('correct');

  const fb = document.getElementById('feedback-box');
  fb.textContent = isCorrect ? '✓ ' + q.correctFeedback : '✗ ' + q.wrongFeedback;
  fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');

  if(isCorrect) gameState.score++;
  updateProgress();

  document.getElementById('next-btn-row').className = 'next-btn-row show';
}

function advanceStory() {
  gameState.questionIdx++;
  updateProgress();

  if(gameState.questionIdx >= QUESTIONS.length) {
    showEndScreen();
    return;
  }

  const prevQ = QUESTIONS[gameState.questionIdx - 1];
  if(prevQ.story) {
    // Show interlude
    document.getElementById('question-panel').classList.add('hidden');
    document.getElementById('scene-panel').classList.remove('hidden');

    const s = prevQ.story;
    document.getElementById('location-tag').textContent = s.location;
    const canvas = document.getElementById('scene-canvas');
    const ctx = canvas.getContext('2d');
    drawScene(ctx, s.bg);

    gameState.currentLines = s.lines;
    gameState.currentSpeaker = s.speaker;
    gameState.dialogueIdx = 0;
    gameState.inStory = true;
    gameState.waitingForQ = false;
    showDialogue(s.speaker, s.lines[0]);

    // Chapter banners for key moments
    const banners = {
      2: ['CHAPTER I','THE ORACLE SPEAKS'],
      4: ['CHAPTER II','THE SACRED SCROLLS'],
      5: ['CHAPTER III','THE SUPREME HELIX REVEALED'],
      8: ['CHAPTER IV','THE FINAL TRIAL'],
    };
    if(banners[gameState.questionIdx]) {
      setTimeout(() => showChapterBanner(banners[gameState.questionIdx][0], banners[gameState.questionIdx][1]), 300);
    }
  } else {
    // No interlude, go straight to question
    showQuestion(gameState.questionIdx);
  }
}

function updateProgress() {
  const pct = (gameState.questionIdx / 10) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('score-display').textContent = `${gameState.score}/${gameState.questionIdx}`;
}

function showEndScreen() {
  document.getElementById('question-panel').classList.add('hidden');
  document.getElementById('scene-panel').classList.add('hidden');

  const s = gameState.score;
  const ranks = [
    [0,2,'EXPELLED INITIATE','Gerald escorts you off the premises. Kevin gives you a sausage sizzle to soften the blow. It is a very good sausage. You will return.'],
    [3,4,'BRONZE HELIX CADET','Not bad. The Roomba gives you a small round of applause. Gerald lets you keep the pink vest. It is growing on you.'],
    [5,6,'SILVER HELIX MEMBER','Respectable. You are invited to the fortnightly meeting. It is held in the fertiliser aisle, as promised. You bring snacks.'],
    [7,8,'GOLD HELIX INITIATE','Excellent! Diane gives you proper epaulette privileges. Kevin defects from the BLAST Brotherhood. It was the sausage sizzle all along.'],
    [9,9,'GRAND HELIX VIZIER','Nearly perfect. Gerald retires. You are Gerald now. You have three eyelids. You are not sure when this happened.'],
    [10,10,'SUPREME HELIX ASCENDANT','FLAWLESS. You are beyond Gerald. You are beyond Diane. You are beyond the hardware store. You and the Roomba ascend to a higher plane. The drill bit remains unpurchased. It was never about the drill bit.'],
  ];

  let rank = ranks[0];
  for(const r of ranks) { if(s>=r[0] && s<=r[1]) { rank=r; break; } }

  document.getElementById('end-screen').classList.remove('hidden');
  document.getElementById('final-score').textContent = `${s} / 10`;
  document.getElementById('final-rank').textContent = '★ ' + rank[2] + ' ★';
  document.getElementById('final-text').textContent = rank[3];
}

// ============================================================
// CLICK TO ADVANCE DIALOGUE
// ============================================================

document.getElementById('scene-panel').addEventListener('click', () => {
  advanceDialogue();
});

// ============================================================
// GENERATE STARS
// ============================================================

function makeStars() {
  const container = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const star = document.createElement('div');
    star.className='star';
    star.style.left=Math.random()*100+'%';
    star.style.top=Math.random()*100+'%';
    star.style.animationDelay=Math.random()*3+'s';
    star.style.animationDuration=(2+Math.random()*3)+'s';
    container.appendChild(star);
  }
}
makeStars();

// ============================================================
// CANVAS ANIMATION LOOP (subtle)
// ============================================================

let animFrame = 0;
function animate() {
  animFrame++;
  // Gentle re-render for twinkling effects on certain scenes
  // (only if scene panel visible)
  if(!document.getElementById('scene-panel').classList.contains('hidden')) {
    const tag = document.getElementById('location-tag').textContent;
    if(tag.includes('ROOFTOP') || tag.includes('CARPARK') || tag.includes('FORECOURT')) {
      if(animFrame % 60 === 0) {
        // Redraw stars occasionally for twinkle
        const canvas = document.getElementById('scene-canvas');
        // minimal, just keep existing
      }
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>
